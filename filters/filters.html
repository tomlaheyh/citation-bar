<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PubMed Filters Report</title>
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tomlaheyh.github.io/citation-bar/filters/filters.html">
<meta name="description" content="What each of PubMed's sidebar filters actually returns, counted for the current year to date: MEDLINE, abstract, free full text, species, sex, age, article type and language. Free, with CSV export.">
<meta name="author" content="PubMed Citation Bar">
<meta name="theme-color" content="#005a8c">
<meta property="og:type" content="article">
<meta property="og:site_name" content="PubMed Citation Bar">
<meta property="og:title" content="PubMed Filters Report">
<meta property="og:description" content="What each of PubMed's sidebar filters actually returns, counted for the current year to date: MEDLINE, abstract, free full text, species, sex, age, article type and language. Free, with CSV export.">
<meta property="og:url" content="https://tomlaheyh.github.io/citation-bar/filters/filters.html">
<link rel="icon" href="../assets/icon128.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --border: #d0d5dd;
    --text: #1a1a2e;
    --text-muted: #64748b;
    --accent: #1e40af;
    --accent-light: #dbeafe;
    --section-bg: #e8f0fe;
    --green: #16a34a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Source Sans 3', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 20px 0;
    margin-bottom: 24px;
  }

  header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding-top: 0;
    padding-bottom: 0;
  }

  h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .subtitle { font-size: 0.85rem; color: var(--text-muted); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
  }
  .status-dot.updating { background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .btn {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .note-bar {
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    padding: 10px 16px;
    font-size: 0.82rem;
    color: var(--accent);
    margin-bottom: 20px;
    border-radius: 0 6px 6px 0;
  }

  .progress-bar-container {
    width: 100%; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
    display: none;
  }
  .progress-bar-container.active { display: block; }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }

  /* Three-column layout */
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .columns { grid-template-columns: 1fr; }
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .col-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  .col-table td {
    padding: 5px 10px;
    border-bottom: 1px solid #eef0f4;
  }

  .col-table td:first-child {
    color: var(--text);
  }

  .col-table td:last-child {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    white-space: nowrap;
  }

  .col-table tr:hover { background: #f7f9fc; }

  .col-table tr.section-header td {
    background: var(--section-bg);
    font-weight: 700;
    color: var(--accent);
    border-bottom: 2px solid var(--border);
    padding: 8px 10px;
  }

  .col-table tr.total-row td {
    font-weight: 700;
    background: #fafbfd;
    border-bottom: 2px solid var(--border);
  }

  .col-table tr.total-row td:last-child {
    font-size: 0.85rem;
  }

  .col-table td:first-child a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-muted);
  }
  .col-table td:first-child a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
    border-bottom-style: solid;
  }

  td.loading-cell {
    color: var(--text-muted);
    font-style: italic;
  }

  /* A filter name PubMed no longer recognises. Must never look like a 0. */
  td.dead-cell {
    color: #b3261e;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #deadBanner {
    background: #fdecea;
    border: 1px solid #f5c2bd;
    border-left: 4px solid #b3261e;
    border-radius: 4px;
    padding: 9px 12px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: #7a1a12;
    line-height: 1.45;
  }
  #deadBanner b { color: #b3261e; }

  /* References section */
  .ref-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .ref-section h3 {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .ref-section a {
    color: var(--accent);
    font-size: 0.82rem;
    word-break: break-all;
  }

  .ref-section p {
    margin-bottom: 6px;
    font-size: 0.82rem;
  }

  .favorites-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px 24px;
    margin-top: 10px;
    font-size: 0.82rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
  }

  @media (max-width: 700px) {
    .favorites-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<script src="../siteNav.js"></script>

<div class="container" style="padding-top:12px">
  <div style="display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
    <span class="status-dot" id="statusDot"></span>
    <span style="font-size:0.82rem;color:var(--text-muted)" id="statusText">Loading...</span>
    <span style="font-size:0.82rem;color:var(--text-muted)" id="reportPeriod"></span>
    <button class="btn" id="refreshBtn" onclick="forceRefresh()" disabled>Force Refresh</button>
    <button class="btn" id="exportBtn" onclick="exportCSV()" disabled>Export CSV</button>
  </div>
  <div class="note-bar" id="noteBar" style="margin-bottom:12px"></div>
  <div class="progress-bar-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="deadBanner" hidden></div>

  <div class="columns" id="columnsArea"></div>

  <div class="ref-section" id="refSection"></div>
</div>

<script>
let CONFIG = null;
const CACHE_KEY = 'pubmed_filters_cache';
const EUTILS_BASE = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi';

// Sentinel for "PubMed no longer recognises this filter name". Distinct from
// null (fetch failed / not yet loaded) and from 0 (filter works, no records).
// A retired filter returns Count=0 with no error, so without this the report
// silently prints a plausible zero forever. See ErrorList handling below.
const DEAD = 'DEAD';

// ─── PERIOD MODEL ─────────────────────────────────────────────────
// A "period" is the single source of truth for the timeframe shown. It
// is built EITHER from the data file (server CSV header) OR from the
// clock (a live Force Refresh) — never a mix — so the header label and
// the row links can never drift away from the data they describe.
//   period = {
//     label: 'Jan-Apr'                 // display text
//     year:  2026                      // the data year
//     range: '2026/01/01:2026/04/30'   // PubMed [crdt] date range
//   }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Clock period — used ONLY for a live fetch / Force Refresh.
// The range always ends at the last fully complete month. In January no
// month of the new year is complete yet, so we roll back to the most
// recent complete period: the whole of the prior year (Jan-Dec).
function buildClockPeriod() {
  const now = new Date();
  const cy = now.getFullYear();
  const m = now.getMonth(); // 0-11 = current (incomplete) month
  if (m === 0) {
    const py = cy - 1; // January → show the full prior year
    return { label: 'Jan-Dec', year: py, range: `${py}/01/01:${py}/12/31` };
  }
  const lastCompleteIdx = m - 1; // last fully complete month, 0-based
  const lastDay = new Date(cy, m, 0).getDate();
  const mm = String(m).padStart(2, '0');
  const dd = String(lastDay).padStart(2, '0');
  return { label: `Jan-${MONTHS[lastCompleteIdx]}`, year: cy, range: `${cy}/01/01:${cy}/${mm}/${dd}` };
}

// Parse the period straight from the CSV's first line, e.g.
//   "PubMed Filters Report","Jan-Apr 2026","Generated 2026-05-18"
// The file owns its timeframe, so the displayed label/links match the
// data no matter when the page is opened. Returns null if unparseable.
function parsePeriodFromHeader(cells) {
  if (!cells || cells.length < 2) return null;
  const txt = cells[1] || '';
  const ym = txt.match(/(\d{4})/);
  if (!ym) return null;
  const year = parseInt(ym[1], 10);
  const label = txt.replace(ym[1], '').trim(); // e.g. "Jan-Apr"
  const endTok = label.split('-').pop().trim().slice(0, 3).toLowerCase();
  const endIdx = MONTHS.findIndex(mo => mo.toLowerCase() === endTok);
  if (endIdx < 0) return null;
  const lastDay = new Date(year, endIdx + 1, 0).getDate();
  const mm = String(endIdx + 1).padStart(2, '0');
  const dd = String(lastDay).padStart(2, '0');
  return { label, year, range: `${year}/01/01:${year}/${mm}/${dd}` };
}

function buildTerm(template, period) {
  return template.replace('{daterange}', period.range);
}

function buildPubmedUrl(template, period) {
  const term = buildTerm(template, period);
  return 'https://pubmed.ncbi.nlm.nih.gov/?term=' + encodeURIComponent(term);
}

// ─── CACHE ────────────────────────────────────────────────────────
function getCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function setCache(data) {
  data.timestamp = new Date().toISOString();
  localStorage.setItem(CACHE_KEY, JSON.stringify(data));
}

function shouldRefresh(cache) {
  if (!cache || !cache.timestamp) return true;
  const now = new Date();
  const cached = new Date(cache.timestamp);
  const refreshDay = CONFIG ? CONFIG.refreshDayOfMonth : 10;
  if (now.getMonth() !== cached.getMonth() || now.getFullYear() !== cached.getFullYear()) {
    if (now.getDate() >= refreshDay) return true;
  }
  return false;
}

// ─── NCBI FETCH ───────────────────────────────────────────────────
async function fetchCount(term) {
  // NOTE: retmax=0, NOT rettype=count. rettype=count strips <ErrorList> from
  // the response, making a retired filter byte-identical to a genuine zero.
  // retmax=0 returns the same <Count> plus the ErrorList we need, ~570 bytes.
  const url = `${EUTILS_BASE}?db=pubmed&retmax=0&term=${encodeURIComponent(term)}`;
  for (let attempt = 1; attempt <= 5; attempt++) {
    try {
      const resp = await fetch(url);
      const text = await resp.text();
      // A name PubMed does not know comes back as
      //   <ErrorList><PhraseNotFound>congress</PhraseNotFound></ErrorList>
      // alongside <Count>0</Count>. Our terms are "{daterange} [crdt] AND
      // (token)", and a date range never yields PhraseNotFound, so any
      // PhraseNotFound here means the filter token itself is gone.
      if (/<PhraseNotFound>/.test(text)) return DEAD;
      const match = text.match(/<Count>(\d+)<\/Count>/);
      if (match) return parseInt(match[1]);
    } catch (e) { /* retry */ }
    await sleep(3000 * attempt);
  }
  return null;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function fetchAllData(counts, period, onProgress) {
  const allRows = [];
  CONFIG.sections.forEach(s => {
    s.rows.forEach(r => {
      if (r.type === 'count') allRows.push(r);
    });
  });

  const total = allRows.length;
  let completed = 0;

  for (const row of allRows) {
    const term = buildTerm(row.term, period);
    const count = await fetchCount(term);
    counts[row.id] = count;
    completed++;
    if (onProgress) onProgress(completed, total);
    await sleep(800);
  }
}

// ─── COMPUTED VALUES ──────────────────────────────────────────────
function getRowValue(row, counts) {
  if (row.type === 'count') return counts[row.id] !== undefined ? counts[row.id] : null;
  if (row.type === 'calculated') {
    const parts = row.formula.split(' - ');
    const a = counts[parts[0]];
    const b = counts[parts[1]];
    // A measure built on a dead filter is not a number — withhold it rather
    // than publish an understated one.
    if (a === DEAD || b === DEAD) return DEAD;
    if (a === null || a === undefined || b === null || b === undefined) return null;
    return a - b;
  }
  if (row.type === 'sum_all_at') {
    // Sum all article type count rows (ids starting with "at_"). If ANY of
    // them is dead the sum is understated by an unknown amount, so the whole
    // total is withheld — an understated total that still looks plausible is
    // exactly the failure this guard exists to prevent.
    let sum = 0;
    let hasAny = false;
    for (const key in counts) {
      if (!key.startsWith('at_')) continue;
      if (counts[key] === DEAD) return DEAD;
      if (counts[key] !== null && counts[key] !== undefined) {
        sum += counts[key];
        hasAny = true;
      }
    }
    return hasAny ? sum : null;
  }
  return null;
}

function formatNumber(n) {
  if (n === DEAD) return 'FILTER GONE';
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('en-US');
}

// Single place that decides how a value is painted, so a dead filter can
// never be rendered by a path that only knows about numbers and null.
function setValueCell(td, val) {
  td.textContent = formatNumber(val);
  if (val === DEAD) td.className = 'dead-cell';
  else if (val === null) td.className = 'loading-cell';
}

// Sort helper: dead rows float to the top — a broken filter is the first
// thing that should be seen, not something buried at the bottom of column 2.
function compareRowValues(va, vb) {
  if (va === DEAD && vb === DEAD) return 0;
  if (va === DEAD) return -1;
  if (vb === DEAD) return 1;
  if (va === null && vb === null) return 0;
  if (va === null) return 1;
  if (vb === null) return -1;
  return vb - va;
}

// ─── RENDER ───────────────────────────────────────────────────────
function appendSectionRows(table, section, counts, period) {
  for (const row of section.rows) {
    const tr = document.createElement('tr');
    if (row.bold) tr.className = 'total-row';

    const labelTd = document.createElement('td');
    if (row.term) {
      const link = document.createElement('a');
      link.href = buildPubmedUrl(row.term, period);
      link.target = '_blank';
      link.title = 'Open in PubMed';
      link.textContent = row.label;
      labelTd.appendChild(link);
    } else {
      labelTd.textContent = row.label;
    }
    tr.appendChild(labelTd);

    const valTd = document.createElement('td');
    const val = getRowValue(row, counts);
    setValueCell(valTd, val);
    tr.appendChild(valTd);

    table.appendChild(tr);
  }
}

function render(counts, period) {
  const area = document.getElementById('columnsArea');
  area.innerHTML = '';

  // Column 1: fixed sections
  const col1 = document.createElement('div');
  col1.className = 'column';
  const t1 = document.createElement('table');
  t1.className = 'col-table';

  const fixedSections = CONFIG.sections.filter(s => !s.sorted);

  // Separate core and non-core sections
  const coreSections = fixedSections.filter(s => s.core);
  const otherSections = fixedSections.filter(s => !s.core);

  // Core sections in a bordered wrapper
  if (coreSections.length > 0) {
    const coreDiv = document.createElement('div');
    coreDiv.style.cssText = 'border:2px solid #93b3df;border-radius:6px;overflow:hidden;margin-bottom:6px';
    const coreTable = document.createElement('table');
    coreTable.className = 'col-table';

    for (const section of coreSections) {
      const htr = document.createElement('tr');
      htr.className = 'section-header';
      htr.innerHTML = `<td colspan="2">${section.header}</td>`;
      coreTable.appendChild(htr);
      appendSectionRows(coreTable, section, counts, period);
    }
    coreDiv.appendChild(coreTable);
    col1.appendChild(coreDiv);
  }

  // Other sections in normal table
  for (const section of otherSections) {
    const htr = document.createElement('tr');
    htr.className = 'section-header';
    htr.innerHTML = `<td colspan="2">${section.header}</td>`;
    t1.appendChild(htr);
    appendSectionRows(t1, section, counts, period);
  }

  col1.appendChild(t1);
  area.appendChild(col1);

  // Article type sorted section — split across columns 2 and 3
  const articleSection = CONFIG.sections.find(s => s.sorted);
  if (articleSection) {
    // Separate total row from sortable rows
    const totalRow = articleSection.rows.find(r => r.type === 'sum_all_at');
    const countRows = articleSection.rows.filter(r => r.type === 'count');

    // Sort count rows by value descending
    const sortedRows = countRows.slice().sort((a, b) =>
      compareRowValues(getRowValue(a, counts), getRowValue(b, counts)));

    const mid = Math.ceil(sortedRows.length / 2);
    const col2Rows = sortedRows.slice(0, mid);
    const col3Rows = sortedRows.slice(mid);

    [col2Rows, col3Rows].forEach((rows, ci) => {
      const col = document.createElement('div');
      col.className = 'column';
      const tbl = document.createElement('table');
      tbl.className = 'col-table';

      const htr = document.createElement('tr');
      htr.className = 'section-header';
      htr.innerHTML = `<td colspan="2">${ci === 0 ? articleSection.header : 'Article Type - continued'}</td>`;
      tbl.appendChild(htr);

      // Add total row at top of column 2 only
      if (ci === 0 && totalRow) {
        const ttr = document.createElement('tr');
        ttr.className = 'total-row';
        const ltd = document.createElement('td');
        ltd.textContent = totalRow.label;
        ttr.appendChild(ltd);
        const vtd = document.createElement('td');
        const val = getRowValue(totalRow, counts);
        setValueCell(vtd, val);
        ttr.appendChild(vtd);
        tbl.appendChild(ttr);
      }

      for (const row of rows) {
        const tr = document.createElement('tr');
        const labelTd = document.createElement('td');
        if (row.term) {
          const link = document.createElement('a');
          link.href = buildPubmedUrl(row.term, period);
          link.target = '_blank';
          link.title = 'Open in PubMed';
          link.textContent = row.label;
          labelTd.appendChild(link);
        } else {
          labelTd.textContent = row.label;
        }
        tr.appendChild(labelTd);

        const valTd = document.createElement('td');
        const val = getRowValue(row, counts);
        setValueCell(valTd, val);
        tr.appendChild(valTd);

        tbl.appendChild(tr);
      }

      col.appendChild(tbl);
      area.appendChild(col);
    });
  }

  // Dead-filter alarm
  updateDeadBanner(counts);

  // References
  renderReferences();
}

// Surfaces retired filters at the top of the page. Without this the alarm
// is a single red cell somewhere in a 90-row two-column table.
function updateDeadBanner(counts) {
  const el = document.getElementById('deadBanner');
  if (!el) return;
  const dead = [];
  CONFIG.sections.forEach(s => s.rows.forEach(r => {
    if (r.type === 'count' && counts[r.id] === DEAD) dead.push(r.label);
  }));
  if (dead.length === 0) { el.hidden = true; el.innerHTML = ''; return; }
  el.innerHTML = '<b>&#9888; ' + dead.length + ' filter name' + (dead.length > 1 ? 's are' : ' is') +
    ' no longer recognised by PubMed:</b> ' + dead.join(', ') +
    '. These rows show <b>FILTER GONE</b>, not 0 &mdash; the counts are unknown, not zero. ' +
    'Check the <a href="https://www.nlm.nih.gov/pubs/techbull/" target="_blank">NLM Technical Bulletin</a> ' +
    'for a rename, then update <code>filters-config.json</code>.';
  el.hidden = false;
}

function renderReferences() {
  const ref = document.getElementById('refSection');
  ref.innerHTML = '';

  // Links
  const h3a = document.createElement('h3');
  h3a.textContent = 'Additional Resources';
  ref.appendChild(h3a);

  if (CONFIG.references) {
    const p1 = document.createElement('p');
    p1.innerHTML = `Additional Search Tags list: <a href="${CONFIG.references.search_tags}" target="_blank">${CONFIG.references.search_tags}</a>`;
    ref.appendChild(p1);

    const p2 = document.createElement('p');
    p2.innerHTML = `Official Training: <a href="${CONFIG.references.training}" target="_blank">${CONFIG.references.training}</a>`;
    ref.appendChild(p2);
  }

  // Favorites
  if (CONFIG.favorites && CONFIG.favorites.length > 0) {
    const h3b = document.createElement('h3');
    h3b.textContent = 'My Favorites';
    h3b.style.marginTop = '16px';
    ref.appendChild(h3b);

    const grid = document.createElement('div');
    grid.className = 'favorites-grid';
    CONFIG.favorites.forEach(f => {
      const span = document.createElement('span');
      span.textContent = f;
      grid.appendChild(span);
    });
    ref.appendChild(grid);
  }
}

// ─── STATUS ───────────────────────────────────────────────────────
function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot' + (state === 'updating' ? ' updating' : '');
  txt.textContent = text;
}

function showProgress(pct) {
  const c = document.getElementById('progressContainer');
  const b = document.getElementById('progressBar');
  c.className = 'progress-bar-container active';
  b.style.width = pct + '%';
}

function hideProgress() {
  document.getElementById('progressContainer').className = 'progress-bar-container';
}

// ─── CSV EXPORT ───────────────────────────────────────────────────
// DEAD must survive the round-trip to the CSV and back, or reopening the
// report launders a dead filter into a blank/zero again.
function csvValue(val) {
  if (val === DEAD) return 'DEAD';
  return val !== null && val !== undefined ? val : 'NaN';
}

function exportCSV() {
  const cache = getCache();
  if (!cache || !cache.counts || !cache.period) return;
  const counts = cache.counts;
  const period = cache.period;

  const lines = [];
  const now = new Date();
  // Header period comes from the active period, so the exported file's
  // own header always describes exactly the data it carries.
  lines.push(`"PubMed Filters Report","${period.label} ${period.year}","Generated ${now.toISOString().slice(0,10)}"`);
  lines.push('');

  // Fixed sections
  const fixedSections = CONFIG.sections.filter(s => !s.sorted);
  for (const section of fixedSections) {
    lines.push(`"${section.header}",""`);
    for (const row of section.rows) {
      const val = getRowValue(row, counts);
      lines.push(`"${row.label}",${csvValue(val)}`);
    }
    lines.push('');
  }

  // Article type sorted
  const articleSection = CONFIG.sections.find(s => s.sorted);
  if (articleSection) {
    const sorted = articleSection.rows.slice().sort((a, b) =>
      compareRowValues(getRowValue(a, counts), getRowValue(b, counts)));
    lines.push(`"${articleSection.header}",""`);
    for (const row of sorted) {
      const val = getRowValue(row, counts);
      lines.push(`"${row.label}",${csvValue(val)}`);
    }
  }

  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pubmed-filters-data.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ─── LOAD SERVER DATA ─────────────────────────────────────────────
async function loadServerData() {
  try {
    const resp = await fetch('pubmed-filters-data.csv?_=' + Date.now());
    if (!resp.ok) return null;
    const text = await resp.text();
    return parseCSVData(text);
  } catch { return null; }
}

function parseCSVData(csv) {
  const lines = csv.split('\n').filter(l => l.trim());
  if (lines.length < 3) return null;

  const counts = {};
  const allRows = [];
  CONFIG.sections.forEach(s => s.rows.forEach(r => allRows.push(r)));

  for (let i = 0; i < lines.length; i++) {
    const cells = parseCSVLine(lines[i]);
    if (!cells[0] || cells[1] === '') continue; // skip headers/blanks

    // Find matching config row by label
    const label = cells[0];
    const matchRow = allRows.find(r => r.label === label);
    if (matchRow && matchRow.type === 'count') {
      if (cells[1] === 'DEAD') {
        counts[matchRow.id] = DEAD;
      } else {
        const val = parseInt(cells[1]);
        counts[matchRow.id] = isNaN(val) ? null : val;
      }
    }
  }

  // The file owns its timeframe — parse the period straight from line 0.
  const firstLine = parseCSVLine(lines[0]);
  const period = parsePeriodFromHeader(firstLine);
  const generated = firstLine.length >= 3 ? firstLine[2].replace('Generated ', '') : '';
  return { counts, period, timestamp: generated || new Date().toISOString() };
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
    else { current += ch; }
  }
  result.push(current.trim());
  return result;
}

// ─── MAIN ─────────────────────────────────────────────────────────
async function loadConfig() {
  try {
    const resp = await fetch('filters-config.json');
    CONFIG = await resp.json();
    return true;
  } catch (e) {
    console.error('Failed to load filters-config.json', e);
    return false;
  }
}

function setReportPeriod(period) {
  document.getElementById('reportPeriod').textContent =
    `Standard Side Filters  •  ${period.label} ${period.year}`;
}

async function init() {
  const ok = await loadConfig();
  if (!ok) { setStatus('error', 'Failed to load config'); return; }

  document.getElementById('noteBar').textContent = CONFIG.note;

  // 1. Try server data — the file owns its own timeframe, so we render
  //    the period parsed from its header. The label and the row links can
  //    never outrun the data, no matter when the page is opened.
  const serverData = await loadServerData();
  if (serverData && serverData.counts && Object.keys(serverData.counts).length > 0) {
    const period = serverData.period || buildClockPeriod();
    setReportPeriod(period);
    setCache({ counts: serverData.counts, period });
    render(serverData.counts, period);
    const d = new Date(serverData.timestamp);
    const stale = shouldRefresh({ timestamp: serverData.timestamp });
    const ageMsg = stale
      ? `Server data from ${d.toLocaleDateString()} (may be outdated — click Force Refresh for live data)`
      : `Server data from ${d.toLocaleDateString()}`;
    setStatus('cached', ageMsg);
    document.getElementById('refreshBtn').disabled = false;
    document.getElementById('exportBtn').disabled = false;
    // Note: do NOT auto-refresh on stale server data — the live fetch takes
    // several minutes and blocks the page. Users can click Force Refresh.
    return;
  }

  // No server file → fall back to clock-driven period
  const clockPeriod = buildClockPeriod();
  setReportPeriod(clockPeriod);

  // 2. Try localStorage
  const cache = getCache();
  if (cache && cache.counts && cache.period && !shouldRefresh(cache)) {
    setReportPeriod(cache.period);
    render(cache.counts, cache.period);
    setStatus('cached', `Cached ${new Date(cache.timestamp).toLocaleDateString()}`);
    document.getElementById('refreshBtn').disabled = false;
    document.getElementById('exportBtn').disabled = false;
    return;
  }

  // 3. Fetch live
  if (cache && cache.counts && cache.period) {
    render(cache.counts, cache.period);
  } else {
    render({}, clockPeriod);
  }
  await runFetch(clockPeriod);
}

async function runFetch(period) {
  setStatus('updating', 'Fetching data from NCBI...');
  document.getElementById('refreshBtn').disabled = true;
  document.getElementById('exportBtn').disabled = true;
  showProgress(0);

  const counts = {};

  await fetchAllData(counts, period, (done, total) => {
    const pct = Math.round((done / total) * 100);
    showProgress(pct);
    setStatus('updating', `Fetching... ${done}/${total}`);
    if (done % 5 === 0 || done === total) render(counts, period);
  });

  render(counts, period);
  setCache({ counts, period });
  hideProgress();
  setStatus('done', `Updated ${new Date().toLocaleDateString()}`);
  document.getElementById('refreshBtn').disabled = false;
  document.getElementById('exportBtn').disabled = false;
}

async function forceRefresh() {
  localStorage.removeItem(CACHE_KEY);
  const period = buildClockPeriod();
  setReportPeriod(period);
  await runFetch(period);
}

window.addEventListener('DOMContentLoaded', init);
</script>
